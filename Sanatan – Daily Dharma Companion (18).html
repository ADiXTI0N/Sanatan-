<style>

<script>
const WD=[["Sunday","Surya Dev","ॐ सूर्याय नमः","Om Suryaya Namah","Salutations to the Sun, giver of light and health."],
["Monday","Shiva","ॐ नमः शिवाय","Om Namah Shivaya","I bow to Shiva, the auspicious inner Self."],
["Tuesday","Hanuman","ॐ हनुमते नमः","Om Hanumate Namah","Salutations to Hanuman, symbol of strength and devotion."],
["Wednesday","Ganesha","ॐ गं गणपतये नमः","Om Gam Ganapataye Namah","Salutations to Ganesha, remover of obstacles."],
["Thursday","Vishnu / Guru","ॐ नमो नारायणाय","Om Namo Narayanaya","Salutations to Narayana, the preserver."],
["Friday","Devi Lakshmi / Durga","ॐ श्रीं महालक्ष्म्यै नमः","Om Shreem Mahalakshmyai Namah","Salutations to Mahalakshmi, source of abundance."],
["Saturday","Shani / Hanuman","ॐ शं शनैश्चराय नमः","Om Sham Shanaishcharaya Namah","Salutations to Shani, teacher of discipline and patience."]];
const MANTRAS=[
["Gayatri Mantra (complete)","ॐ भूः ॐ भुवः ॐ स्वः ॐ महः ॐ जनः ॐ तपः ॐ सत्यम् ।\nॐ तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि ।\nधियो यो नः प्रचोदयात् ।\nॐ आपो ज्योती रसोऽमृतं ब्रह्म भूर्भुवः स्वरोम् ॥","Invokes the seven worlds, then: we meditate on the radiant light of the divine Sun; may it inspire our intellect. Ends with the Shiras: water, light, essence, immortal Brahman. (Rigveda 3.62.10)"],
["Mahamrityunjaya (complete)","ॐ हौं जूं सः । ॐ भूर्भुवः स्वः ।\nॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् ।\nउर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात् ।\nॐ स्वः भुवः भूः ॐ । सः जूं हौं ॐ ॥","With its seed syllables: we worship the three-eyed Shiva, fragrant and nourishing; free us from bondage like a ripe cucumber from its vine, and from death into immortality. (Rigveda 7.59.12)"],
["Hanuman Chalisa (complete, 40 chaupais)","॥ दोहा ॥\nश्रीगुरु चरन सरोज रज, निज मनु मुकुरु सुधारि ।\nबरनउँ रघुबर बिमल जसु, जो दायकु फल चारि ॥\nबुद्धिहीन तनु जानिके, सुमिरौं पवन-कुमार ।\nबल बुद्धि बिद्या देहु मोहिं, हरहु कलेस बिकार ॥\n\n॥ चौपाई ॥\nजय हनुमान ज्ञान गुन सागर । जय कपीस तिहुँ लोक उजागर ॥१॥\nराम दूत अतुलित बल धामा । अंजनि-पुत्र पवनसुत नामा ॥२॥\nमहाबीर बिक्रम बजरंगी । कुमति निवार सुमति के संगी ॥३॥\nकंचन बरन बिराज सुबेसा । कानन कुंडल कुंचित केसा ॥४॥\nहाथ बज्र औ ध्वजा बिराजै । काँधे मूँज जनेऊ साजै ॥५॥\nसंकर सुवन केसरीनंदन । तेज प्रताप महा जग बन्दन ॥६॥\nबिद्यावान गुनी अति चातुर । राम काज करिबे को आतुर ॥७॥\nप्रभु चरित्र सुनिबे को रसिया । राम लखन सीता मन बसिया ॥८॥\nसूक्ष्म रूप धरि सियहिं दिखावा । बिकट रूप धरि लंक जरावा ॥९॥\nभीम रूप धरि असुर सँहारे । रामचंद्र के काज सँवारे ॥१०॥\nलाय सजीवन लखन जियाये । श्रीरघुबीर हरषि उर लाये ॥११॥\nरघुपति कीन्ही बहुत बड़ाई । तुम मम प्रिय भरतहि सम भाई ॥१२॥\nसहस बदन तुम्हरो जस गावैं । अस कहि श्रीपति कंठ लगावैं ॥१३॥\nसनकादिक ब्रह्मादि मुनीसा । नारद सारद सहित अहीसा ॥१४॥\nजम कुबेर दिगपाल जहाँ ते । कबि कोबिद कहि सके कहाँ ते ॥१५॥\nतुम उपकार सुग्रीवहिं कीन्हा । राम मिलाय राज पद दीन्हा ॥१६॥\nतुम्हरो मंत्र बिभीषन माना । लंकेस्वर भए सब जग जाना ॥१७॥\nजुग सहस्र जोजन पर भानू । लील्यो ताहि मधुर फल जानू ॥१८॥\nप्रभु मुद्रिका मेलि मुख माहीं । जलधि लाँघि गये अचरज नाहीं ॥१९॥\nदुर्गम काज जगत के जेते । सुगम अनुग्रह तुम्हरे तेते ॥२०॥\nराम दुआरे तुम रखवारे । होत न आज्ञा बिनु पैसारे ॥२१॥\nसब सुख लहै तुम्हारी सरना । तुम रक्षक काहू को डर ना ॥२२॥\nआपन तेज सम्हारो आपै । तीनों लोक हाँक ते काँपै ॥२३॥\nभूत पिसाच निकट नहिं आवै । महाबीर जब नाम सुनावै ॥२४॥\nनासै रोग हरै सब पीरा । जपत निरंतर हनुमत बीरा ॥२५॥\nसंकट तें हनुमान छुड़ावै । मन क्रम बचन ध्यान जो लावै ॥२६॥\nसब पर राम तपस्वी राजा । तिन के काज सकल तुम साजा ॥२७॥\nऔर मनोरथ जो कोई लावै । सोई अमित जीवन फल पावै ॥२८॥\nचारों जुग परताप तुम्हारा । है परसिद्ध जगत उजियारा ॥२९॥\nसाधु संत के तुम रखवारे । असुर निकंदन राम दुलारे ॥३०॥\nअष्ट सिद्धि नौ निधि के दाता । अस बर दीन जानकी माता ॥३१॥\nराम रसायन तुम्हरे पासा । सदा रहो रघुपति के दासा ॥३२॥\nतुम्हरे भजन राम को पावै । जनम जनम के दुख बिसरावै ॥३३॥\nअंत काल रघुबर पुर जाई । जहाँ जन्म हरि-भक्त कहाई ॥३४॥\nऔर देवता चित्त न धरई । हनुमत सेई सर्ब सुख करई ॥३५॥\nसंकट कटै मिटै सब पीरा । जो सुमिरै हनुमत बलबीरा ॥३६॥\nजय जय जय हनुमान गोसाईं । कृपा करहु गुरु देव की नाईं ॥३७॥\nजो सत बार पाठ कर कोई । छूटहि बंदि महा सुख होई ॥३८॥\nजो यह पढ़ै हनुमान चालीसा । होय सिद्धि साखी गौरीसा ॥३९॥\nतुलसीदास सदा हरि चेरा । कीजै नाथ हृदय मँह डेरा ॥४०॥\n\n॥ दोहा ॥\nपवन तनय संकट हरन, मंगल मूरति रूप ।\nराम लखन सीता सहित, हृदय बसहु सुर भूप ॥","Forty verses by Tulsidas in praise of Hanuman: his strength, devotion to Rama and the leap to Lanka. Tuesdays and Saturdays are special for recitation."],
["Shanti Mantra (Purna)","ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥","That is whole, this is whole; from wholeness comes wholeness; taking wholeness from wholeness, wholeness remains. (Isha Upanishad)"],
["Shanti Mantra (Saha Navavatu)","ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥","May we be protected together, nourished together, work together with vigor; may our study be bright, may we never quarrel. (Taittiriya Upanishad)"],
["Asato Ma","ॐ असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्मा अमृतं गमय ॥ ॐ शान्तिः शान्तिः शान्तिः ॥","Lead me from untruth to truth, from darkness to light, from death to immortality. (Brihadaranyaka Upanishad)"],
["Sarve Bhavantu Sukhinah","सर्वे भवन्तु सुखिनः । सर्वे सन्तु निरामयाः । सर्वे भद्राणि पश्यन्तु । मा कश्चिद्दुःखभाग्भवेत् ॥","May all be happy, all free from illness; may all see good, and may no one suffer."],
["Om Namah Shivaya","ॐ नमः शिवाय","Salutations to Shiva, the auspicious inner Self (the Panchakshari mantra)."],
["Shiva Dhyana","कर्पूरगौरं करुणावतारं संसारसारं भुजगेन्द्रहारम् । सदा वसन्तं हृदयारविन्दे भवं भवानीसहितं नमामि ॥","I bow to Shiva, white as camphor, an incarnation of compassion, essence of existence, wearing the serpent king, ever dwelling in the lotus of the heart with Bhavani."],
["Vishnu Dhyana","शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं विश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यं वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम् ॥","I bow to Vishnu: serene, reclining on the serpent, lotus-naveled, support of the universe, cloud-hued, beloved of Lakshmi, lotus-eyed, reached by yogis in meditation, remover of fear of rebirth, lord of all worlds."],
["Ganesh Vandana","वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ । निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥","O curved-trunk, mighty Ganesha, radiant as a million suns, remove obstacles from all my work, always."],
["Saraswati Vandana","या कुन्देन्दुतुषारहारधवला या शुभ्रवस्त्रावृता । या वीणावरदण्डमण्डितकरा या श्वेतपद्मासना ॥ या ब्रह्माच्युतशङ्करप्रभृतिभिर्देवैः सदा वन्दिता । सा मां पातु सरस्वती भगवती निःशेषजाड्यापहा ॥","May Saraswati, white as jasmine and moon, robed in white, holding the veena, seated on a white lotus, ever worshipped by Brahma, Vishnu and Shiva, protect me and remove all dullness."],
["Durga Mantra","सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तु ते ॥","O auspicious one, fulfiller of all aims, refuge, Gauri, Narayani, salutations to you. (Devi Mahatmya)"],
["Hanuman Dhyana","मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् । वातात्मजं वानरयूथमुख्यं श्रीरामदूतं शिरसा नमामि ॥","I bow to Hanuman: swift as mind and wind, master of senses, foremost of the wise, son of Vayu, chief of the vanaras, messenger of Rama."],
["Surya Mantra","ॐ जपाकुसुमसङ्काशं काश्यपेयं महाद्युतिम् । तमोऽरिं सर्वपापघ्नं प्रणतोऽस्मि दिवाकरम् ॥","I bow to Surya, red like the hibiscus, son of Kashyapa, supremely radiant, enemy of darkness and destroyer of all sins."],
["Guru Mantra","गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुर्देवो महेश्वरः । गुरुः साक्षात् परं ब्रह्म तस्मै श्रीगुरवे नमः ॥","The Guru is Brahma, Vishnu and Maheshwara; the Guru is the Supreme itself. Salutations to that Guru."],
["Rama Taraka","श्रीराम राम रामेति रमे रामे मनोरमे । सहस्रनाम तत्तुल्यं रामनाम वरानने ॥","Chanting 'Rama' once equals the thousand names of Vishnu. (Shiva to Parvati)"],

const FQ=[
["om aum pranava omkara","Om (ॐ)","Om is the sacred syllable of Sanatan Dharma, called *pranava*. It is said to hold all sound and all existence.\n- The Mandukya Upanishad reads A-U-M as waking, dream and deep sleep, and the silence after it as *turiya*, the fourth state of pure awareness.\n- It opens and closes most mantras and prayers.\n- Chanting it slowly with a long humming 'mmm' steadies the breath and mind.\n> ॐ\n> Om\n> The primal sound; the symbol of Brahman."],
["karma action fruit result","Karma","Karma means *action*, and the results that follow from it. Good action bears good fruit, though traditions differ on how and when the fruit arrives.\n- **Karma yoga:** act with full effort but without clinging to the result.\n- The Gita (2.47) says you have a right to the action, never to its fruits.\n> कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।\n> You have the right to action alone, never to its fruits.\nTakeaway: Do your best, then let go of the outcome."],
["dharma duty righteousness","Dharma","Dharma comes from the root *dhri*, 'to uphold'. It means righteous duty and the order that sustains life.\n- **Universal dharma:** truth, non-violence, compassion, self-control.\n- **Svadharma:** your own duty, based on your role and stage of life. The Gita (3.35) says one's own dharma, even imperfect, is better than another's done well.\nTakeaway: Ask what is right here and now, not what is easy."],
["moksha mukti liberation freedom","Moksha","Moksha is liberation from ignorance and from the cycle of birth and death (*samsara*). It is the last of the four goals of life (dharma, artha, kama, moksha).\n- **Advaita:** the self (atman) is one with Brahman.\n- **Dvaita:** liberation is eternal devotion to God, who stays distinct from the soul.\n- **Vishishtadvaita:** the soul is part of God, with a qualified oneness.\nPaths to it: karma, jnana, bhakti and raja yoga."],
["atman brahman self soul mahavakya tat tvam asi","Atman and Brahman","*Atman* is the true Self; *Brahman* is the ultimate reality. The four Mahavakyas (great sayings) express their relationship:\n- Tat tvam asi: 'That you are' (Chandogya 6.8.7)\n- Aham Brahmasmi: 'I am Brahman' (Brihadaranyaka 1.4.10)\n- Ayam atma brahma: 'This Self is Brahman' (Mandukya 1.2)\n- Prajnanam brahma: 'Consciousness is Brahman' (Aitareya 3.3)\nSchools differ: Advaita reads them as identity, Dvaita as closeness without identity."],
["guna gunas sattva rajas tamas","The three gunas","The gunas are three qualities of nature described in Gita chapter 14 and Samkhya.\n- **Sattva:** clarity, balance, calm\n- **Rajas:** activity, desire, restlessness\n- **Tamas:** inertia, dullness, confusion\nEveryone has all three, and they rise and fall. Practice aims to grow sattva and ultimately go beyond all three."],
["yoga path margas bhakti jnana raja patanjali","Paths of yoga","Four classic paths lead toward the same goal:\n- **Karma yoga:** selfless action\n- **Jnana yoga:** knowledge and discernment\n- **Bhakti yoga:** loving devotion\n- **Raja yoga:** meditation, from Patanjali's eight limbs: yama, niyama, asana, pranayama, pratyahara, dharana, dhyana, samadhi.\nMost people mix them."],
["meditate meditation dhyana mind focus calm","How to meditate","A simple way to begin:\n- Sit comfortably with a tall spine and relaxed shoulders.\n- Breathe naturally. Silently repeat a mantra such as *Om* or *So Ham* with each breath.\n- When the mind wanders, gently return to the mantra. That return is the practice.\n- Start with 5 to 10 minutes at the same time every day.\nTry the Meditate tab for sounds, mantras and a timer."],
["diya lamp deepam light lighting flame","Why we light a diya","A lamp is lit to honour light over darkness and knowledge over ignorance.\n> तमसो मा ज्योतिर्गमय\n> Tamaso ma jyotirgamaya\n> Lead me from darkness to light. (Brihadaranyaka Upanishad)\n- It is lit at dawn and dusk, before puja and on Diwali.\n- Ghee or oil is often explained as our ego and negativity, burned away by the flame of awareness."],
["trimurti brahma vishnu shiva shakti devi trinity","Trimurti and the Divine Mother","Brahma creates, Vishnu preserves and Shiva transforms. The Divine Mother (Devi, Shakti) is the energy behind all of them.\nTraditions emphasise different forms: Vaishnavas center on Vishnu, Shaivas on Shiva, Shaktas on Devi, and Smartas worship them together. Many see all as aspects of one reality."],
["avatar avatara dashavatara incarnation","Dashavatara (ten avatars of Vishnu)","The commonly listed ten are Matsya (fish), Kurma (tortoise), Varaha (boar), Narasimha (man-lion), Vamana (dwarf), Parashurama, Rama, Krishna, Buddha (in some lists Balarama), and Kalki, who is yet to come.\nThe Gita (4.7) gives the idea: whenever dharma declines, the divine manifests. Lists vary by tradition."],
["gita bhagavad geeta krishna arjuna kurukshetra","Bhagavad Gita","The Gita is a dialogue between Krishna and Arjuna on the Kurukshetra battlefield, part of the Mahabharata (Bhishma Parva).\n- 18 chapters and about 700 verses\n- Themes: duty, karma yoga, jnana, bhakti and the nature of the Self\n- Famous verses: 2.47 (action without attachment), 4.7 (dharma and the divine), 6.5 (lift yourself by yourself)\nUse the Texts tab to read verses chapter by chapter."],
["ramayana mahabharata epic itihasa","Ramayana and Mahabharata","The two great epics (*itihasa*).\n- **Ramayana** (Valmiki): the story of Rama, Sita, Lakshmana and Hanuman and the victory of dharma over Ravana.\n- **Mahabharata** (Vyasa): the story of the Pandavas and Kauravas, the largest epic in the world, containing the Bhagavad Gita."],
["pranayama breath breathing anulom vilom","Pranayama","Pranayama is yogic breath regulation (*prana* is life force, *ayama* is extension). A gentle beginner practice is alternate-nostril breathing (anulom vilom): inhale left, exhale right, inhale right, exhale left, slowly and without strain.\nStop if you feel dizzy, and ask a doctor first if you have heart, blood pressure or breathing conditions."],
["puja worship ritual aarti prasad offering","Basics of puja","A simple home puja usually includes:\n- Cleaning the space and a calm mind\n- Lighting a lamp and incense\n- Invoking the deity with a mantra\n- Offering flowers, water and food (*naivedya*)\n- Aarti (waving the lamp) and prayer\n- Sharing the blessed food (*prasad*)\nSincerity matters more than perfection. Customs vary by family and region."],
["ekadashi fast fasting vrat","Ekadashi","Ekadashi is the 11th lunar day of each fortnight, so there are two a month, and is dedicated to Vishnu. Many people fast or eat light, avoid grains and spend time in prayer. The fast is broken the next morning (*parana*). Check your local panchang for exact timing."],
["tithi panchang panchanga lunar calendar paksha","Tithi and the panchang","A *tithi* is a lunar day, defined by the moon's angle from the sun; there are 30 in a lunar month, split into Shukla (waxing) and Krishna (waning) paksha. The *panchang* has five parts: tithi, vara (weekday), nakshatra, yoga and karana. Festival dates follow tithis, so they move on the Gregorian calendar each year."],
["namaste namaskar greeting","Namaste","*Namaste* comes from Sanskrit *namah te*, 'I bow to you'. Palms together at the heart (anjali mudra) honour the divine in the other person."],
["samsara rebirth reincarnation","Samsara and rebirth","Samsara is the cycle of birth, death and rebirth, driven by karma and ignorance until moksha. The Gita (2.22) compares it to changing worn-out clothes for new ones: the Self casts off old bodies and takes new ones."],
["shanti peace three times","Why Shanti is chanted three times","'Om Shanti Shanti Shanti' asks for peace at three levels: within oneself (*adhyatmika*), from the world and nature (*adhibhautika*), and from divine or unseen forces (*adhidaivika*)."],
["sanatan dharma hinduism eternal","What is Sanatan Dharma?","*Sanatan* means eternal and *dharma* means the order that upholds life, so it is 'the eternal way', a name widely used for Hinduism. It has no single founder or scripture, and includes many paths, schools and deities, rooted in the Vedas, Upanishads, epics and Puranas."],
["japa mala beads chanting 108","Japa and the 108 beads","Japa is the repetition of a mantra, usually counted on a 108-bead mala. Turn one bead per chant, never crossing the larger *meru* bead. 108 is a sacred number in many traditions. Try the japa counter on the Home tab."]];

const EK=[["01","The question",[["p","Ekam Anekam is not a new religion. It is not a new scripture, and it does not try to replace Sanātana Dharma. Brahman, Ātman, Dharma, Karma, Mokṣa, Yoga and Bhakti already belong to Sanātana thought."],["b","If reality is One and its manifestations are Many, <em>how should human beings live with one another?</em>"],["p","I asked this because I have watched people turn differences in devotion into battles over God. Deep devotion to your own form of the Divine is beautiful. It goes wrong when love for God turns into rivalry."]]],
["02","Ekam <span class=\"ekm\">the One</span>",[["v","एकं सद् विप्रा बहुधा वदन्ति","Reality is One; the sages speak of it in many ways.","Ṛgveda 1.164.46"],["p","I do not want to misuse this verse. It does not prove that every religion is the same, and it belongs to a Vedic hymn with its own setting. Its central language still speaks to this philosophy: the One can be spoken of in many ways, which does not erase the Many."]]],
["03","Anekam <span class=\"ekm\">the Many</span>",[["p","Śiva, Viṣṇu, Kṛṣṇa, Rāma, Devī, Sūrya. Let each person walk their path sincerely and let devotion grow deep."],["b","Your devotion does not become stronger because someone else's becomes weaker."],["v","ये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम्","In whatever way people approach Me, in that way I respond to them.","Bhagavad Gītā 4.11"],["p","Commentators read this verse in different ways, so it should not be flattened into \"all paths are identical\". What it shows is that different does not automatically mean false, and difference does not require hostility."]]],
["04","The Divine within",[["v","ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति","The Lord dwells in the heart of all beings, O Arjuna.","Bhagavad Gītā 18.61"],["p","Imagine searching the whole house for something that was in your own pocket. The spiritual journey is not about manufacturing God. It is about removing the ego, fear, attachment and ignorance that block recognition."],["p","Temple, murti, pūjā, mantra and Guru still matter. Outer and inner do not have to be enemies."]]],
["05","Worship becomes life",[["v","स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः","By worshipping Him through one's own duty, a person attains perfection.","Bhagavad Gītā 18.46"],["p","Work can become an offering. How you treat people, use power and act when nobody is watching is part of the path."],["b","Freedom, <em>with</em> responsibility."],["p","Freedom is not an excuse to harm, and Dharma is not an excuse to control. Viveka, discernment, holds the two together."]]],
["06","Difference without hatred",[["p","I can follow Sanātana Dharma without hating a Muslim, a Christian, a Buddhist, a Jain or a Sikh. Respecting another path does not mean abandoning mine, and it does not mean pretending all religions teach the same thing."],["b","Unity does not require <em>uniformity.</em>"],["p","Both people can say \"I believe differently\" and still see each other's humanity. That is harder than making everyone agree."]]]];

FQ.push(
["kali maa mahakali kalika kreem goddess","Maa Kali","*Kali* (काली) comes from *kala*, meaning both time and black. She is the fierce form of the Divine Mother who devours ignorance, fear and ego, and who holds Time itself.\n- Her image is read symbolically: dark colour for the infinite, the garland as the letters of the mind offered to the Mother, the sword for cutting illusion, and an open hand that says *abhaya* (fear not).\n- She is especially worshipped in Bengal, Assam and Odisha. Kalighat and Dakshineswar (Ramakrishna's temple) are famous shrines.\n- Kali Puja is held on the new-moon night of Kartika, the Diwali night in Bengal.\n> ॐ क्रीं कालिकायै नमः\n> Om Kreem Kalikayai Namah\n> Salutations to Kali. Tap 🌑 Meditate with Kali on the Deities tab."],
["navagraha mantra planets mantras nine","Navagraha beej mantras","Traditional mantras for the nine grahas:\n- Surya: ॐ सूर्याय नमः\n- Chandra: ॐ सोमाय नमः\n- Mangala: ॐ अं अङ्गारकाय नमः\n- Budha: ॐ बुं बुधाय नमः\n- Guru: ॐ बृं बृहस्पतये नमः\n- Shukra: ॐ शुं शुक्राय नमः\n- Shani: ॐ शं शनैश्चराय नमः\n- Rahu: ॐ रां राहवे नमः\n- Ketu: ॐ कें केतवे नमः"],
["kundli janam patri birth chart horoscope","What is a Kundli?","A Kundli (janam patri) is a map of the sky at the moment and place of birth. It shows the Lagna (rising sign), the nine grahas placed in 12 houses, the Moon's nakshatra and the Dasha timeline. Vedic astrology (Jyotisha) uses it for reflection and guidance. Try the Kundli tab."],
["sidereal tropical ayanamsa western vedic sign differ","Why Vedic and Western signs differ","Vedic astrology uses the *sidereal* zodiac, fixed to the stars, while Western astrology uses the *tropical* zodiac, fixed to the seasons. Because of the slow precession of the equinoxes, the gap (the *ayanamsa*, about 24° today with the Lahiri system) means your Vedic Sun sign is usually the one before your Western sign."],
["dasha vimshottari mahadasha antardasha period","Vimshottari Dasha","The most used timing system: a 120-year cycle ruled by nine planets in fixed order and length: Ketu 7, Venus 20, Sun 6, Moon 10, Mars 7, Rahu 18, Jupiter 16, Saturn 19, Mercury 17 years. Your first period depends on your Moon's nakshatra and how much of it had passed at birth."],
["house bhava houses twelve 12 meaning","The 12 houses (bhavas)","1 self and body · 2 wealth, family, speech · 3 courage and siblings · 4 home and mother · 5 children and intelligence · 6 service, health, obstacles · 7 partnerships · 8 change and longevity · 9 fortune and dharma · 10 career and status · 11 gains and friends · 12 expenses and liberation. Houses 1, 4, 7, 10 are *kendras*; 1, 5, 9 are *trikonas*."],
["retrograde vakri backward planet","Retrograde planets (vakri)","A planet looks as if it moves backward against the stars because of the relative motion of Earth. In Jyotisha such planets are considered to act in a more inward, intense or delayed way. Rahu and Ketu are always shown retrograde."],
["rahu ketu nodes shadow eclipse","Rahu and Ketu","The lunar nodes, the points where the Moon's path crosses the Sun's. They cause eclipses and are called shadow planets. Rahu is linked with ambition, worldliness and obsession; Ketu with detachment, past patterns and spirituality. They are always exactly opposite each other."],
["sade sati saturn moon seven half","Sade Sati","Sade Sati is the roughly 7.5-year period when Saturn passes through the sign before, the sign of, and the sign after your Moon sign (about 2.5 years each). Tradition sees it as a time of discipline and lessons, not only hardship. Ask in the Kundli tab whether it is running for you."],
["mangal dosha manglik kuja","Mangal Dosha","Traditionally, Mars in houses 1, 2, 4, 7, 8 or 12 from the Lagna (some also count from the Moon or Venus) is called Mangal Dosha and is considered in marriage matching. Opinions vary widely and many astrologers note cancellations, so it should not be treated as a verdict."],
["navamsa d9 divisional chart","Navamsa (D9)","The Navamsa divides each sign into nine parts of 3°20′. The D9 chart is read for the deeper strength of planets and for marriage and dharma. It is the most important divisional chart after the birth chart."],
["exalted debilitated exaltation debilitation uchcha neecha","Exaltation and debilitation","Exalted (uchcha) signs: Sun in Mesha, Moon in Vrishabha, Mars in Makara, Mercury in Kanya, Jupiter in Karka, Venus in Meena, Saturn in Tula. A planet is debilitated (neecha) in the opposite sign. Traditionally an exalted planet is strong and a debilitated one needs support."],
["gemstone ratna gem stone planets","Gemstones and planets","Traditional associations: Ruby with Sun, Pearl with Moon, Red coral with Mars, Emerald with Mercury, Yellow sapphire with Jupiter, Diamond with Venus, Blue sapphire with Saturn, Hessonite with Rahu and Cat's eye with Ketu. There is no scientific evidence that gems affect events, and stones like blue sapphire are expensive, so please consult an experienced astrologer before buying any."],
["weekday day worship fasting saturday tuesday vara","Weekdays and worship","Sunday: Surya · Monday: Shiva and Chandra · Tuesday: Hanuman and Mangala · Wednesday: Ganesha and Budha · Thursday: Vishnu and Guru · Friday: Lakshmi, Devi and Shukra · Saturday: Shani and Hanuman. Customs vary by family and region."],
["nakshatra twenty seven 27 padas pada","Nakshatras and padas","The zodiac has 27 nakshatras (lunar mansions) of 13°20′ each, and each has four padas of 3°20′, so there are 108 padas in all. Your birth nakshatra is the one the Moon was in. Use the Kundli tab to find yours."],
["guna milan ashtakoota matching marriage compatibility 36","Guna Milan (Ashtakoota)","Marriage matching compares the two Moon nakshatras in eight categories worth 36 points: Varna 1, Vashya 2, Tara 3, Yoni 4, Graha Maitri 5, Gana 6, Bhakoot 7 and Nadi 8. 18 or more is traditionally considered acceptable. Many families also consider the Mangal Dosha."],
